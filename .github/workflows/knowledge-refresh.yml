name: Knowledge Refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: true
        default: "release-watch"
        type: choice
        options:
          - release-watch
          - stable-docs
          - manual
      no_fetch:
        description: "Use registry fallback text instead of fetching external docs"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run refresh policy
        env:
          REFRESH_MODE: ${{ inputs.mode || 'release-watch' }}
          NO_FETCH: ${{ inputs.no_fetch || 'false' }}
        run: |
          FLAGS=""
          if [ "$NO_FETCH" = "true" ]; then
            FLAGS="$FLAGS --no-fetch"
          fi
          python knowledge/refresh/refresh_policy.py \
            --mode "$REFRESH_MODE" \
            $FLAGS

      - name: Upload refresh reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-refresh-report
          path: |
            knowledge/reports/
            evals/reports/
