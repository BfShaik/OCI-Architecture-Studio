name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingestion smoke test
        run: |
          python knowledge/ingestion/ingest.py --no-fetch
          python knowledge/refresh/ingest_releases.py --no-fetch

      - name: Deployment config template validation
        run: |
          python infra/scripts/validate_deployment_config.py \
            --tfvars infra/terraform/envs/staging/terraform.tfvars.example \
            --allow-placeholders

      - name: Backend tests
        working-directory: app/backend
        env:
          PYTHONPATH: src
        run: |
          pytest -q

      - name: Golden prompt evals
        run: |
          python evals/run_golden.py --output-dir evals/reports/golden

      - name: Edge-case evals
        run: |
          python evals/run_golden.py --cases evals/edge-cases.jsonl --output-dir evals/reports/edge-cases

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-reports
          path: evals/reports/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Frontend build
        working-directory: app/frontend
        run: npm run build
